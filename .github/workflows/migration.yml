name: Idempotent Mattermost Migration & Upgrade

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  MM_VERSION: v12.0.1
  MA_URL: https://github.com/mattermost/migration-assist/releases/latest/download/migration-assist-Linux-x86_64.tar.gz

jobs:
  migrate-and-deploy:
    runs-on: self-hosted
    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
      DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
      MYSQL_DSN: root:${{ secrets.DB_MYSQL_ROOT_PASSWORD }}@tcp(mattermost-mysql:3306)/mattermost
      PG_DSN: postgres://postgres:${{ secrets.DB_POSTGRES_PASSWORD }}@mattermost-postgres:5432/mattermost?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Migration Status
        id: check_status
        run: |
          if [ -f "$HOME/.mattermost_migration_completed" ]; then
            echo "✅ Already migrated. Skipping backup and data transfer."
            echo "already_migrated=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Migration required."
            echo "already_migrated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop legacy Mattermost
        if: steps.check_status.outputs.already_migrated == 'false'
        run: docker stop mattermost || true

      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          if ! docker ps --format '{{.Names}}' | grep -qx mattermost-mysql; then
            echo "❌ Legacy MySQL container is not running!"
            exit 1
          fi
          mkdir -p "$HOME/mattermost_backups"
          BACKUP="$HOME/mattermost_backups/mattermost_mysql_${GITHUB_RUN_ID}.sql"
          docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mattermost-mysql \
            mysqldump -u root --single-transaction mattermost > "$BACKUP"
          test -s "$BACKUP"
          echo "✅ Backup saved: $BACKUP"

      - name: Download migration-assist
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/ma"
          curl -fsSL "$MA_URL" | tar -xz -C "$RUNNER_TEMP/ma"
          ls -la "$RUNNER_TEMP/ma"

      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker compose -f "$COMPOSE_FILE" up -d db-postgres
          for i in $(seq 1 30); do
            if docker exec mattermost-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          echo "❌ PostgreSQL did not become ready"
          exit 1

      # Идемпотентность: каждый запуск начинает с чистой БД
      - name: Recreate target database
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker exec mattermost-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS mattermost WITH (FORCE);" \
            -c "CREATE DATABASE mattermost;"
          docker exec mattermost-postgres psql -U postgres -d mattermost -v ON_ERROR_STOP=1 \
            -c "ALTER SCHEMA public OWNER TO postgres;"

      - name: Check MySQL schema
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker run --rm --network=mattermost_network -v "$RUNNER_TEMP/ma:/ma:ro" alpine:3.20 \
            /ma/migration-assist mysql "$MYSQL_DSN" --fix-artifacts --fix-unicode --fix-varchar

      - name: Create PostgreSQL schema (official migrations)
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker run --rm --network=mattermost_network -e PG_DSN -e MM_VERSION -v "$RUNNER_TEMP/ma:/ma:ro" alpine:3.20 \
            sh -c 'apk add --no-cache git >/dev/null && /ma/migration-assist postgres "$PG_DSN" --run-migrations --mattermost-version="$MM_VERSION"'

      - name: Generate pgloader config
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker run --rm --network=mattermost_network -v "$RUNNER_TEMP/ma:/ma:ro" alpine:3.20 \
            /ma/migration-assist pgloader --mysql="$MYSQL_DSN" --postgres="$PG_DSN" --remove-null-chars \
            > "$RUNNER_TEMP/migration.load"
          test -s "$RUNNER_TEMP/migration.load"

      - name: Run pgloader
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker run --rm --network=mattermost_network -v "$RUNNER_TEMP:/work" \
            mattermost/mattermost-pgloader:latest pgloader /work/migration.load

      - name: Post-migrate (indexes)
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker run --rm --network=mattermost_network -v "$RUNNER_TEMP/ma:/ma:ro" alpine:3.20 \
            /ma/migration-assist postgres post-migrate --create-indexes "$PG_DSN"

      - name: Remove legacy containers & mark completed
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          rm -f "$RUNNER_TEMP/migration.load"
          docker rm -f mattermost mattermost-mysql || true
          touch "$HOME/.mattermost_migration_completed"

      - name: Deploy Upgraded Stack
        run: |
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
          docker compose -f "$COMPOSE_FILE" ps

      - name: Health Check
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8065/api/v4/system/ping; then
              echo
              echo "✅ Mattermost is up on PostgreSQL"
              exit 0
            fi
            echo "waiting... ($i/60)"
            sleep 5
          done
          echo "❌ Health check failed"
          docker compose -f "$COMPOSE_FILE" logs --tail 80
          exit 1

      - name: Verify data
        run: |
          docker exec mattermost-postgres psql -U postgres -d mattermost -tA -c \
            "SELECT 'posts', count(*) FROM posts UNION ALL SELECT 'users', count(*) FROM users UNION ALL SELECT 'channels', count(*) FROM channels;"
